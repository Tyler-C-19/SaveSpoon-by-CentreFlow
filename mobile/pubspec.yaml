name: savespoon
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geocoding: ^5.0.1
  geolocator: ^14.1.2
  go_router: ^18.1.2
  google_maps_flutter: ^2.19.0
  google_maps_flutter_android: ^2.21.0
  google_maps_flutter_platform_interface: ^2.17.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Newer versions break the build when the Flutter SDK path has a space.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
